<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-lang-key="title">Аналитика - CargoPay</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">

</head>
<body>
    <div class="container">
        <h1 data-lang-key="dashboard_title">Дашборд аналитики</h1>

        <div class="chart-wrapper">
            <canvas id="tripsChart"></canvas>
        </div>

        <a href="{{ url_for('index') }}" class="back-button" data-lang-key="back_to_admin">На главную</a>
    </div>

    <script>
        const translations = {
            ru: {
                title: 'Аналитика - CargoPay',
                dashboard_title: 'Дашборд аналитики',
                chart_label: 'Количество рейсов',
                back_to_admin: 'На главную',
                months: ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек']
            },
            en: {
                title: 'Analytics - CargoPay',
                dashboard_title: 'Analytics Dashboard',
                chart_label: 'Number of Trips',
                back_to_admin: 'Back to the main pagel',
                months: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec']
            }
        };

        let tripsChart;


        function initChart(lang) {
            const t = translations[lang];
            const ctx = document.getElementById('tripsChart').getContext('2d');


            const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-color').trim();
            const textColor = getComputedStyle(document.documentElement).getPropertyValue('--text-secondary').trim();
            const barFill = getComputedStyle(document.documentElement).getPropertyValue('--bar-fill').trim();
            const barBorder = getComputedStyle(document.documentElement).getPropertyValue('--bar-border').trim();

            const config = {
                type: 'bar',
                data: {
                    labels: t.months.slice(0, 5),
                    datasets: [{
                        label: t.chart_label,
                        data: [12, 19, 3, 5, 2],
                        backgroundColor: barFill,
                        borderColor: barBorder,
                        borderWidth: 1.5,
                        borderRadius: 0,
                        hoverBackgroundColor: barFill.replace('0.85', '0.95'),
                        borderDash: [4, 2],
                        roughness: 0.6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                color: textColor,
                                font: { size: 13, family: "'Segoe UI', sans-serif" },
                                boxWidth: 12,
                                padding: 15
                            }
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            max: 20,
                            grid: {
                                color: gridColor,
                                drawBorder: false,
                                borderDash: [5, 4] // Пунктир для эффекта "от руки"
                            },
                            ticks: {
                                color: textColor,
                                font: { size: 11 },
                                stepSize: 2,
                                padding: 8
                            }
                        },
                        x: {
                            grid: { display: false },
                            ticks: {
                                color: textColor,
                                font: { size: 11 },
                                padding: 8
                            }
                        }
                    },
                    animation: { duration: 600, easing: 'easeOutQuart' }
                }
            };

            if (tripsChart) tripsChart.destroy();
            tripsChart = new Chart(ctx, config);
        }
        function applyLanguage(lang) {
            const t = translations[lang];
            if (!t) return;
            document.querySelectorAll('[data-lang-key]').forEach(el => {
                const key = el.getAttribute('data-lang-key');
                if (t[key]) el.textContent = t[key];
            });
            initChart(lang);
            document.documentElement.lang = lang;
        }
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') document.documentElement.classList.add('theme-dark');
            else if (savedTheme === 'light') document.documentElement.classList.add('theme-light');

            const savedLang = localStorage.getItem('language') || 'ru';
            applyLanguage(savedLang);
        });
        window.addEventListener('message', (e) => {
            if (e.data && e.data.type === 'languageChange') {
                applyLanguage(e.data.lang);
                localStorage.setItem('language', e.data.lang);
            }
        });
    </script>
</body>
</html>
