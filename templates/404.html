<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Страница не найдена | CargoPay</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='404.css') }}">
</head>
<body class="dashboard-body">
    <script>
        const root = document.documentElement;
        const body = document.body;
        const savedTheme = localStorage.getItem('theme');

        if (savedTheme === 'light') {
            // Светлая тема: для index.html (:root.light) и login.html (без .dark)
            root.classList.add('light');
            body.classList.remove('dark');
        } else {
            // Тёмная тема: для index.html (по умолчанию) и login.html (body.dark)
            root.classList.remove('light');
            body.classList.add('dark');
        }
    </script>

    <div class="error-page">
        <div class="error-container">
            <div class="error-icon">🚚</div>
            <div class="error-code">404</div>
            <h1 class="error-title">Страница не найдена</h1>
            <p class="error-message">
                Похоже, этот рейс ушёл не по тому маршруту.<br>
                Страница, которую вы ищете, не существует или была перемещена.
            </p>
            <a href="{{ url_for('index') }}" class="btn-home">Вернуться на главную</a>
        </div>
    </div>
</body>
</html>
